<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" fill="none">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2029"/>
      <stop offset="100%" stop-color="#123B48"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#cbg)"/>
  <!-- Equipment silhouettes -->
  <g opacity="0.15">
    <!-- Chair -->
    <rect x="700" y="200" width="200" height="20" rx="10" fill="#35B6C8" transform="rotate(-15, 800, 210)"/>
    <rect x="680" y="180" width="40" height="200" rx="8" fill="#1B6878"/>
    <circle cx="720" cy="350" r="25" fill="#1B6878"/>
    <!-- Light -->
    <circle cx="850" cy="120" r="30" fill="#35B6C8" opacity="0.5"/>
    <rect x="845" y="140" width="10" height="60" fill="#1B6878"/>
    <!-- Monitor -->
    <rect x="950" y="100" width="120" height="80" rx="8" fill="#1B6878"/>
    <rect x="1000" y="180" width="20" height="40" fill="#1B6878"/>
    <!-- Small tools -->
    <rect x="500" y="250" width="80" height="8" rx="4" fill="#35B6C8" transform="rotate(30, 540, 254)"/>
    <rect x="520" y="280" width="60" height="6" rx="3" fill="#1B6878" transform="rotate(-10, 550, 283)"/>
  </g>
  <!-- Grid overlay -->
  <g opacity="0.03" stroke="white" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/><line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>
  </g>
</svg>
